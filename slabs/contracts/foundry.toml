[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
gas_reports = ["PackSale", "MirrorNFT", "Fulfiller"]
fs_permissions = [{ access = "read", path = "./config" }]

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 512

[invariant]
runs = 256
depth = 32
fail_on_revert = false

[profile.ci]
fuzz = { runs = 4096 }
invariant = { runs = 1024, depth = 64 }

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"

[etherscan]
robinhood = { key = "any", url = "https://robinhoodchain.blockscout.com/api", chain = 4663 }
