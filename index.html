<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PokePlay</title>
    <meta
      name="description"
      content="Build a team of six from the original 151, post a wager for free or for ETH, and battle another trainer live on Robinhood Chain."
    />

    <!-- The mark, inlined so the tab icon needs no extra request. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='%23fff'/%3E%3Cpath d='M10 50a40 40 0 0 1 80 0Z' fill='%23ff2323'/%3E%3Cpath d='M10 50h80' stroke='%230d0d0d' stroke-width='8.5'/%3E%3Ccircle cx='50' cy='50' r='40' fill='none' stroke='%230d0d0d' stroke-width='8.5'/%3E%3Cpath d='M45.5 42 58 50 45.5 58Z' fill='%23fff' stroke='%230d0d0d' stroke-width='6.5' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="apple-touch-icon" href="/brand/pokeplay-logo.png" />

    <!--
      Link previews. og:image MUST be an absolute URL: X and every other crawler fetches it
      without a page to resolve a relative path against, so "/brand/pokeplay-logo.png" silently
      failed and the card fell back to a placeholder icon. The twitter:* tags are set explicitly
      rather than left to fall through to og:*, because some crawlers only read their own
      namespace once any twitter:* tag is present.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PokePlay" />
    <meta property="og:title" content="PokePlay" />
    <meta
      property="og:description"
      content="Pokémon Cards, Battles and Tournaments on Robinhood"
    />
    <meta property="og:image" content="https://pokeplay.fun/brand/pokeplay-logo.png" />
    <meta property="og:image:width" content="500" />
    <meta property="og:image:height" content="500" />
    <meta property="og:image:alt" content="PokePlay" />
    <meta property="og:url" content="https://pokeplay.fun" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="PokePlay" />
    <meta
      name="twitter:description"
      content="Pokémon Cards, Battles and Tournaments on Robinhood"
    />
    <meta name="twitter:image" content="https://pokeplay.fun/brand/pokeplay-logo.png" />
    <meta name="twitter:image:alt" content="PokePlay" />
    <meta name="theme-color" content="#fbfaf6" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
